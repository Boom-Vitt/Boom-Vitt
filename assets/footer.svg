text{font-family:Inter, 'Segoe UI', 'Helvetica Neue', Arial, 'Noto Sans Thai', 'Leelawadee UI', Thonburi, sans-serif}@media (prefers-reduced-motion:reduce){.w,.w2{animation:none}}</style>
