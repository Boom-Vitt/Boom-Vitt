name: snake
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [master]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#14b8a6&color_dots=#ebedf0,#a7f3d0,#5eead4,#14b8a6,#0f766e
            dist/snake-dark.svg?palette=github-dark&color_snake=#5eead4&color_dots=#161b22,#134e4a,#0f766e,#14b8a6,#5eead4
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
